<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" conten="Miguel Angel Urbano Calero" />
    <title>Ejercicio con formularios</title>
    <link rel="stylesheet" href="estilos_formularios.css" />
  </head>
  <body>
    <h1>Ejercicio con formularios</h1>

    <main>
      <div></div>
      <form action="procesar.php" method="post">
        <h2>Formulario de pedido</h2>

        <label for="cliente">Nombre del cliente:</label>
        <input type="text" id="cliente" name="nombre_cliente" required />

        <label for="correo_pedido">Correo electrónico:</label>
        <input type="email" id="correo_pedido" name="correo_cliente" required />

        <label for="fecha">Fecha deseada de entrega:</label>
        <input type="date" id="fecha" name="fecha_entrega" />

        <label for="color">Color del producto:</label>
        <input type="color" id="color" name="color_producto" value="#000000" />

        <label for="cantidad">Cantidad (1 a 10):</label>
        <input
          type="range"
          id="cantidad"
          name="cantidad"
          min="1"
          max="10"
          value="5"
        />

        <label for="accesorios">Accesorios adicionales:</label>
        <select id="accesorios" name="accesorios[]" multiple size="4">
          <option>Funda protectora</option>
          <option>Batería adicional</option>
          <option>Soporte de mesa</option>
          <option>Kit de limpieza</option>
        </select>

        <label
          ><input type="checkbox" name="terminos" value="Aceptados" required />
          Acepto los términos del pedido</label
        >

        <label for="instrucciones"
          >Comentarios o instrucciones especiales:</label
        >
        <textarea
          id="instrucciones"
          name="instrucciones"
          placeholder="Indica detalles adicionales sobre tu pedido..."
        ></textarea>

        <input type="submit" value="Enviar pedido" />
      </form>
    </main>
  </body>
</html>
