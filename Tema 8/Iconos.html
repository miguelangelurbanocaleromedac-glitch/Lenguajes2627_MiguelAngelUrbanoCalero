<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Miguel Ángel Urbano Calero">
    <title>Ejercicio 1 - Menú de Navegación con Iconos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f5f7fa;
        margin: 0;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        box-sizing: border-box;
      }

      .contenedor-ejercicio {
        background-color: #ffffff;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        padding: 40px;
        max-width: 850px;
        width: 100%;
        text-align: center;
      }

      h1.titulo {
        color: #3b82f6;
        font-size: 26px;
        margin: 0 0 12px 0;
        font-weight: 700;
      }

      p.descripcion {
        color: #64748b;
        font-size: 13px;
        max-width: 650px;
        margin: 0 auto 35px auto;
        line-height: 1.5;
      }

      .menu-navegacion {
        background-color: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 12px 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      }

      .menu-navegacion ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
      }

      .menu-navegacion li {
        margin: 0;
      }

      .menu-navegacion a {
        text-decoration: none;
        color: #334155;
        font-size: 14px;
        font-weight: 600;
        padding: 10px 16px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: all 0.25s ease-in-out;
      }

      .menu-navegacion a i {
        color: #3b82f6;
        font-size: 16px;
        transition: transform 0.25s ease;
      }

      .menu-navegacion a:hover {
        background-color: #eff6ff;
        color: #2563eb;
      }

      .menu-navegacion a:hover i {
        transform: scale(1.15);
      }

      .pie-autor {
        margin-top: 40px;
        color: #94a3b8;
        font-size: 12px;
      }
    </style>
  </head>
  <body>

    <div class="contenedor-ejercicio">
      <h1 class="titulo">Menú con Iconos</h1>
      <p class="descripcion">
        Este menú está creado usando una lista no numerada y la librería de iconos Font Awesome. Cada elemento del menú incluye un icono seguido del texto.
      </p>

     
      <nav class="menu-navegacion">
        <ul>
          <li><a href="#"><i class="fa-solid fa-house-chimney"></i> Inicio</a></li>
          <li><a href="#"><i class="fa-solid fa-circle-user"></i> Perfil</a></li>
          <li><a href="#"><i class="fa-solid fa-sliders"></i> Configuración</a></li>
          <li><a href="#"><i class="fa-solid fa-circle-info"></i> Ayuda</a></li>
          <li><a href="#"><i class="fa-solid fa-paper-plane"></i> Contacto</a></li>
          <li><a href="#"><i class="fa-solid fa-door-open"></i> Login</a></li>
        </ul>
      </nav>

      <div class="pie-autor">
        Autor: [Miguel Ángel Urbano Calero]
      </div>
    </div>

  </body>
</html>
