<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triángulos y Círculos</title>
    <meta name="author" content="Miguel Ángel Urbano Calero">

    <style>

        


        .caja1{
            border: 100px;
            border-style: solid;
            border-color: blue yellow green red ;
            margin: 20px;
        }

        .caja2{
            background-color: green;
            border-radius: 50%;
            width: 100px;
            height: 100px;
        }

        .caja3{
            border-width: 100px;
            border-style: solid;
            border-color: blue transparent green red;
            margin: 20px;
        }


        .caja4{
            background-color: green;
            border-radius: 100px 0 0 100px;
            width: 50px;
            height: 100px;
        }

        .caja5{
            border-width: 100px;
            border-style: solid;
            border-color: transparent transparent transparent blue;
            margin: 20px;
        }

        .caja6{
            background-color: green;
            border-radius:  0 0 100px 100px;
            width: 100px;
            height: 50px;
        }

    </style>
</head>
<body>

    <table>
        <tr>
            <td>
                <div class="caja1"></div>
            </td>

            <td>
                <div class="caja2"></div>
            </td>
        </tr>

        <tr>
            <td>
                <div class="caja3"></div>
            </td>

            <td>
                <div class="caja4"></div>
            </td>
        </tr>

        <tr>
            <td>
                <div class="caja5"></div>
            </td>

            <td>
                <div class="caja6"></div>
            </td>
        </tr>
    </table>


    
</body>
</html>
