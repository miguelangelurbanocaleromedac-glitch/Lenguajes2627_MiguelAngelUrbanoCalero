<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>

      .caja{
        width: 200px;
        height: 150px;
      }
      
              .caja1{

                  background-color: antiquewhite;
                  border-color:black;
                  border-style: dotted;
                  border-width: 5px;
                  
                  margin:10px;
              }

              .caja2{
               background-color: yellow;
               border: 3px solid black;
               border-radius: 0 35px 35px 0;
               
               border-left: 40px solid black;
               margin:10px;
    

              }
               .caja3{
                 
                  background-color: salmon;
                  border: 16px ridge rosybrown;
                 
                  
              }
               .caja4{
                    background-color: rgb(100, 243, 100);
                    border: 20px inset darkgreen;
                    border-radius: 0 60px 0 60px;
                    margin: 10px;
                    
              }
               .caja5{
                  width: 200px; 
                  height: 150px; 
                  background-color: rgb(252, 226, 143);
                  border: 5px dashed orange;
                  border-radius: 50%;
              }
               .caja6{
        
                  background-color: lightblue;
                  border: 20px inset blue;
                  border-radius: 0 60px 0 60px;
                  margin: 10px;
              }
               .caja7{
                  
                  background-color: red;
                  border: 2px solid red;    
              }
               .caja8{
                  width: 200px; ;
                  height: 150px; ;
                  background-color: red;
                  border: 2px solid black;
              }
               .caja9{
                  width: 200px; ;
                  height: 150px; ;
                  background-color: red;
                  border: 2px solid black;
              }
    </style>
  </head>
  <body>
    <table>
      <tr>
        <td><div class="caja caja1"></div></td>
        <td><div class="caja caja2"></div></td>
        <td><div class="caja caja3"></div></td>
      </tr>
      <tr>
        <td><div class="caja caja4"></div></td>
        <td><div class="caja caja5"></div></td>
        <td><div class="caja caja6"></div></td>
      </tr>
      <tr>
        <td><div class="caja caja7"></div></td>
        <td><div class="caja caja8"></div></td>
        <td><div class="caja caja9"></div></td>
      </tr>
    </table>
  </body>
</html>
